# Optional local Postgres for trying eng-ops, plus the containerised app.
#
#   npm run db:up               # start Postgres on this checkout's claimed port
#   npm run seed                # load the demo schema
#   npm run dev                 # serve the app on its claimed port
#
#   npm run app:up              # …or run the built container against that db
#   npm run app:down
#
# The ports and the matching DATABASE_URL are allocated per checkout by
# scripts/portlock.mjs and written to .worktree/ports.env; `npm run ports`
# prints them. The npm scripts above pass that file's values through, so prefer
# them over a bare `docker compose`.
#
# `app` sits behind a profile so `npm run db:up` still starts only the database.

services:
  db:
    image: postgres:17
    # No container_name: it is machine-global, so it would collide between
    # worktrees. COMPOSE_PROJECT_NAME (from .worktree/ports.env) already gives
    # each checkout its own container and volume names.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # Claimed by scripts/portlock.mjs. The default is only for a bare
      # `docker compose up` run outside the npm scripts.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - eng-ops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ['app']
    build:
      context: .
    image: ${ENGOPS_IMAGE:-eng-ops:local}
    # --wait-for-db covers the gap between "Postgres accepts connections" and
    # "Postgres is ready to answer", and makes a restart after `down`/`up` safe.
    command: ['--wait-for-db', '60']
    environment:
      # Container-internal: always 5432 on the compose network, whatever port
      # portlock published on the host.
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      # Off by default. `ENGOPS_WRITE=1 npm run app:up` to allow writes.
      ENGOPS_WRITE: ${ENGOPS_WRITE:-}
      PGSCHEMA: ${PGSCHEMA:-}
    depends_on:
      db:
        condition: service_healthy
    # Loopback-only, unlike db: this is the unauthenticated admin UI itself.
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    init: true
    restart: unless-stopped

  # One-shot: load scripts/seed.sql into `db`, the same file `npm run seed`
  # uses — for when you have Docker but no local psql.
  # Destructive: it drops and recreates the demo tables.
  seed:
    profiles: ['seed']
    image: postgres:17
    entrypoint:
      ['psql', 'postgres://postgres:postgres@db:5432/postgres', '-v', 'ON_ERROR_STOP=1', '-f', '/seed.sql']
    volumes:
      - ./scripts/seed.sql:/seed.sql:ro
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

volumes:
  eng-ops-pgdata:
