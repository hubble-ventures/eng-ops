name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          # Build only bundles code; a valid-looking URL keeps env validation
          # happy if anything evaluates it at build time. Not a real database.
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
